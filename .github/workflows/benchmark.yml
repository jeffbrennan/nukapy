name: Benchmark

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python benchmarks/run.py
