[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nukapy"
version = "0.0.0"
description = "A modern Python SDK for the Socrata Open Data API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "nukapy contributors" },
]
keywords = ["socrata", "soda", "open-data", "sdk"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
  "python-dotenv>=1.0",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/jeffbenninghoff/nukapy"
Repository = "https://github.com/jeffbenninghoff/nukapy"
Issues = "https://github.com/jeffbenninghoff/nukapy/issues"

[project.scripts]
nukapy = "nukapy.cli:app"

[dependency-groups]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=7.1.0",
  "pytest-recording>=0.13",
  "respx>=0.21",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nukapy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D100",
  "D203",
  "D104",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**/*.py" = ["INP001"]
"examples/**/*.py" = ["INP001", "T201"]
"tests/**/*.py" = ["D103", "INP001", "S101", "S106"]

[tool.pyright]
include = ["src", "tests", "benchmarks", "examples"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "auto"
markers = [
  "integration: tests that call external services",
]
