[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nukapy"
version = "0.0.0"
description = "A modern Python SDK for the Socrata Open Data API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "nukapy contributors" },
]
keywords = ["socrata", "soda", "open-data", "sdk"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pyarrow>=16",
  "pydantic>=2",
  "python-dotenv>=1.0",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/jeffbenninghoff/nukapy"
Repository = "https://github.com/jeffbenninghoff/nukapy"
Issues = "https://github.com/jeffbenninghoff/nukapy/issues"

[project.scripts]
nukapy = "nukapy.cli:app"

[dependency-groups]
dev = [
  "pyrefly>=0.17.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=7.1.0",
  "pytest-recording>=0.13",
  "respx>=0.21",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nukapy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "A001",    # class name shadows a Python builtin (e.g. TimeoutError)
  "A004",    # import shadows a Python builtin (e.g. TimeoutError)
  "COM812",
  "D100",
  "D104",
  "D105",    # missing docstring in magic method
  "D107",    # missing docstring in __init__
  "D203",
  "D213",
  "PLR0913", # too many arguments in function definition
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**/*.py" = ["INP001"]
"examples/**/*.py" = ["INP001", "T201"]
"tests/**/*.py" = [
  "ARG001",  # unused function argument (common in mock handlers)
  "D103",
  "FURB110", # ternary vs or (readability preference in tests)
  "INP001",
  "PLR2004", # magic value comparisons (common in assertions)
  "S101",
  "S106",
  "SIM117",  # nested with statements (clearer context in tests)
  "SLF001",  # private member access (needed to inspect internals)
]

[tool.pyrefly]
source_paths = ["src", "tests", "benchmarks", "examples"]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "auto"
markers = [
  "integration: tests that call external services",
]
